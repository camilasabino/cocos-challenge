services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env (see .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      # Demo database. `cocos_test` is created by db/init/00-create-test-db.sh.
      POSTGRES_DB: cocos
    ports:
      # Bound to loopback only: this is a local development database.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Init scripts only run when the data volume is empty.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # `-h 127.0.0.1` forces TCP. During first-time init the temporary server
      # only listens on a unix socket, so the container is not reported healthy
      # until init scripts finished and the real server is up.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d cocos']
      interval: 2s
      timeout: 3s
      retries: 30

  # Optional: the production image against the database above. Inside the
  # Compose network PostgreSQL is `postgres:5432`, not localhost.
  app:
    profiles: ['app']
    build: .
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/cocos
      PORT: '3000'
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:3000'

volumes:
  postgres_data:
